[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "secretscan"
version = "1.1.1"
description = "Dependency-free scanner for leaked secrets in files or staged git changes, with baselines."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "TPOALOS"}]
keywords = ["secrets", "security", "pre-commit", "devsecops", "scanner"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/TPOALOS/secretscan"

[project.scripts]
secretscan = "secretscan:main"

[tool.setuptools]
py-modules = ["secretscan"]
